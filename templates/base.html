
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <meta name="description" content="Nexora Business builds modern digital experiences, websites, and business solutions.">
    <title>{% block title %}Nexora Business | Digital Innovation{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="site-header">
        <nav class="nav container" aria-label="Main navigation">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-mark">N</span>
                <span>NEXORA<span class="brand-light">.</span></span>
            </a>

            <button class="menu-toggle" id="menuToggle"
                    type="button" aria-label="Open navigation"
                    aria-expanded="false" aria-controls="navLinks">
                <span></span><span></span><span></span>
            </button>

            <div class="nav-links" id="navLinks">
                <a href="{{ url_for('home') }}#home">Home</a>
                <a href="{{ url_for('home') }}#services">Services</a>
                <a href="{{ url_for('home') }}#about">About</a>
                <a href="{{ url_for('home') }}#work">Our Work</a>
                <a href="{{ url_for('home') }}#contact">Contact</a>
                <a class="button button-small" href="{{ url_for('home') }}#contact">
                    Let's Talk <span aria-hidden="true">↗</span>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="container flash-container" aria-live="polite">
            {% for category, message in get_flashed_messages(with_categories=true) %}
                <div class="flash flash-{{ category }}">
                    <span>{{ message }}</span>
                    <button type="button" class="flash-close"
                            aria-label="Dismiss message">×</button>
                </div>
            {% endfor %}
        </div>

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-mark">N</span>
                <span>NEXORA<span class="brand-light">.</span></span>
            </a>
            <p>Turning bold ideas into digital experiences.</p>
            <span>© <span id="currentYear">2026</span> Nexora Business</span>
        </div>
    </footer>
</body>
</html>
